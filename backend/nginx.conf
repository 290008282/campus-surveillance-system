user www-data;
worker_processes auto;
pid /run/nginx.pid;
include /etc/nginx/modules-enabled/*.conf;

events {
	worker_connections 4096;
}

	http {

	sendfile on;
	tcp_nopush on;
	types_hash_max_size 2048;

	include /etc/nginx/mime.types;
	default_type application/octet-stream;

	# Security headers
	add_header X-Frame-Options "SAMEORIGIN" always;
	add_header X-Content-Type-Options "nosniff" always;
	add_header X-XSS-Protection "1; mode=block" always;
	add_header Referrer-Policy "no-referrer-when-downgrade" always;
	add_header Content-Security-Policy "default-src 'self' http: https: data: blob: 'unsafe-inline'" always;

	ssl_protocols TLSv1.2 TLSv1.3;
	ssl_prefer_server_ciphers on;

	access_log /var/log/nginx/access.log;
	error_log /var/log/nginx/error.log;

	gzip on;

	include /etc/nginx/conf.d/*.conf;

	server{
  listen 80;
  server_name _;
  client_max_body_size 10M;

  	location / {
	    index index.html;
      root /usr/share/campus-surveillance-system/frontend/dist;
      try_files $uri $uri/ =404;
	  }

		location /public/ {
			proxy_pass http://localhost:3000/public/;
			proxy_set_header Host $host;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection upgrade;
      proxy_set_header Accept-Encoding "gzip";
		}

    location /api/ {
      proxy_pass http://localhost:3000/api/;
      proxy_set_header Host $host;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection upgrade;
      proxy_set_header Accept-Encoding "gzip";
    }

		location /ws {
			proxy_pass http://localhost:3000;
			proxy_http_version 1.1;
			proxy_set_header Upgrade $http_upgrade;
			proxy_set_header Connection "upgrade";
			proxy_set_header Host $host;
			proxy_read_timeout 1h;
		}

		location /hls/ {
      types {
          application/vnd.apple.mpegurl m3u8;
          video/mp2t ts;
      }
      alias /dev/shm/nginx-live/;
      add_header Cache-Control no-cache;
      add_header Access-Control-Allow-Origin $http_origin always;
      add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
      add_header Access-Control-Allow-Headers "Range, Authorization" always;
      add_header Access-Control-Allow-Credentials true always;

      if ($request_method = 'OPTIONS') {
          add_header Access-Control-Allow-Origin $http_origin always;
          add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
          add_header Access-Control-Allow-Headers "Range, Authorization" always;
          add_header Access-Control-Allow-Credentials true always;
          add_header Access-Control-Max-Age 1728000;
          add_header Content-Type 'text/plain; charset=utf-8';
          add_header Content-Length 0;
          return 204;
      }
	  }
  }
}

rtmp {
    server {
      listen 1515;
			chunk_size 4096;
      application live {
          live on;
          drop_idle_publisher 5s;
          hls on;
          hls_path /dev/shm/nginx-live;
					hls_cleanup on;
					hls_type live;
					hls_fragment_naming system;
    hls_fragment 2s;
    hls_playlist_length 8s;
    hls_fragment_slicing plain;
      }
  }
}