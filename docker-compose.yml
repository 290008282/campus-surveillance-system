services:
  mysql:
    image: mysql:8.0
    container_name: campus-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: campus-surveillance-system
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - campus-network

  front-backend:
    build:
      context: .
      dockerfile: front-backend.Dockerfile
    container_name: campus-front-backend
    shm_size: '512m'
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: campus-surveillance-system
      MYSQL_USER: root
      MYSQL_PASSWORD: root
      JWT_SECRET: campus-secret-key-change-in-production
      JWT_EXPIRES_IN: 30d
      PUBLIC_DIR_ABSOLUTE_PATH: /var/www/html/public
    ports:
      - "8088:80"
      - "3000:3000"
      - "1515:1935"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - campus-network
    restart: unless-stopped

  ai-end:
    build:
      context: .
      dockerfile: ai-end.Dockerfile
    container_name: campus-ai-end
    environment:
      HTTP_SERVER_URL: "http://front-backend:3000"
      RTMP_SERVER_URL: "rtmp://front-backend:1515/live"
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: admin
    depends_on:
      - front-backend
    networks:
      - campus-network
    restart: unless-stopped

volumes:
  mysql_data:

networks:
  campus-network:
    driver: bridge